name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Lokalindeki sürümle eşitledik
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build All Tenants
        # Burada "npm run build" yerine senin scriptini çalıştırıyoruz
        run: node build-all.js 

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ÖNEMLİ: Artik "build" klasörünü değil, 
          # her şeyin toplandığı "dist" klasörünü yüklüyoruz.
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4