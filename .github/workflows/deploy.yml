name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  setup:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          JSON=$(jq -c 'keys' customers.config.json)
          echo "matrix=$JSON" >> $GITHUB_OUTPUT

  build:
    name: Build (${{ matrix.tenant }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tenant: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Docusaurus
        uses: actions/cache@v4
        with:
          path: |
            .docusaurus
            node_modules/.cache
          key: ${{ runner.os }}-docusaurus-${{ matrix.tenant }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx', '**/package-lock.json', 'docs/**', 'customers.config.json') }}
          restore-keys: |
            ${{ runner.os }}-docusaurus-${{ matrix.tenant }}-

      - name: Build ${{ matrix.tenant }}
        run: CUSTOMER_ID=${{ matrix.tenant }} npx docusaurus build --out-dir dist/${{ matrix.tenant }}

      - name: Upload Tenant Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenant-${{ matrix.tenant }}
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all tenant artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tenant-*
          merge-multiple: true

      - name: Finalize Build (index.html & static assets)
        run: node finalize-build.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true